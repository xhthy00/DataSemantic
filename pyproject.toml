[project]
name = "datasemantic"
version = "0.1.0"
description = "Versioned, authenticated HTTP planning service for WrenAI Core"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "pymysql[rsa]>=1.1,<2",
    "sqlglot>=29,<31",
    "uvicorn>=0.32,<1",
    "wrenai==0.17.1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wren_semantic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".state"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
