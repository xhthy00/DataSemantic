services:
  wren-semantic:
    image: datasemantic:0.1.0
    build: .
    init: true
    restart: unless-stopped
    environment:
      WREN_SERVICE_TOKEN: ${WREN_SERVICE_TOKEN:?Run python3 scripts/init_env.py first}
      WREN_REGISTRY_PATH: /models/registry.json
      WREN_PLAN_TIMEOUT_SECONDS: ${WREN_PLAN_TIMEOUT_SECONDS:-15}
      WREN_STARTUP_TIMEOUT_SECONDS: ${WREN_STARTUP_TIMEOUT_SECONDS:-60}
      WREN_MAX_CONCURRENT_PLANS: ${WREN_MAX_CONCURRENT_PLANS:-2}
      WREN_MAX_REQUEST_BYTES: ${WREN_MAX_REQUEST_BYTES:-65536}
      WREN_EXECUTION_TIMEOUT_SECONDS: ${WREN_EXECUTION_TIMEOUT_SECONDS:-15}
      WREN_MAX_CONCURRENT_EXECUTIONS: ${WREN_MAX_CONCURRENT_EXECUTIONS:-2}
      WREN_EXECUTION_MAX_RESULT_BYTES: ${WREN_EXECUTION_MAX_RESULT_BYTES:-4194304}
      WREN_STUDIO_ENABLED: ${WREN_STUDIO_ENABLED:-false}
      WREN_STUDIO_PASSWORD: ${WREN_STUDIO_PASSWORD:-}
      WREN_STUDIO_DATA_DIR: /state/studio
      WREN_STUDIO_COOKIE_SECURE: ${WREN_STUDIO_COOKIE_SECURE:-false}
      WREN_STUDIO_MAX_REQUEST_BYTES: ${WREN_STUDIO_MAX_REQUEST_BYTES:-1048576}
    ports:
      - "127.0.0.1:${WREN_HTTP_PORT:-8090}:8090"
    volumes:
      - ./models:/models:ro
      - studio-data:/state
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=3).read()"
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  studio-data:
